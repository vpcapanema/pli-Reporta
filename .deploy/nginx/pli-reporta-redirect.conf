# =============================================================================
# PLI Reporta — atalho /pli-reporta no Nginx principal do SIGMA
#
# O Reporta e uma PWA que exige HTTPS (contexto seguro para GPS/camera) e usa
# caminhos absolutos + service worker no escopo "/", entao NAO pode ser servido
# sob um subpath HTTP sem quebrar. Em vez disso, publicamos um atalho HTTP no IP
# que redireciona para a URL HTTPS oficial, preservando o caminho.
#
#   http://<IP-do-SIGMA>/pli-reporta[/...]  ->  https://pli-reporta.56-125-163-194.sslip.io/...
#
# Instale em /etc/nginx/snippets/pli-reporta-redirect.conf e inclua dentro do
# server{} :80 do SIGMA: include /etc/nginx/snippets/pli-reporta-redirect.conf;
# =============================================================================

location = /pli-reporta {
    return 301 https://pli-reporta.56-125-163-194.sslip.io/;
}

location ^~ /pli-reporta/ {
    rewrite ^/pli-reporta/(.*)$ https://pli-reporta.56-125-163-194.sslip.io/$1 redirect;
}
