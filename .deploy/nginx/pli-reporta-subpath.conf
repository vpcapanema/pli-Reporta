# =============================================================================
# PLI Reporta — sub-rota real sob o Nginx principal do SIGMA (Opcao B)
#
#   http://<IP-do-SIGMA>/pli-reporta/...  ->  127.0.0.1:8090 (uvicorn/FastAPI)
#
# O Nginx faz o strip do prefixo (proxy_pass com barra final) e envia
# X-Forwarded-Prefix: /pli-reporta. O backend (middleware subpath_rewrite)
# reescreve URLs absolutas no HTML/JSON e injeta o shim de fetch/SW.
#
# OBS: GPS/camera exigem HTTPS (contexto seguro). Em HTTP no IP, a captura de
# foto/localizacao pode nao funcionar; consulta ao mapa/gestao funciona.
#
# Instale em /etc/nginx/snippets/pli-reporta-subpath.conf e inclua no server{}
# :80 do SIGMA:  include /etc/nginx/snippets/pli-reporta-subpath.conf;
# =============================================================================

location = /pli-reporta { return 301 /pli-reporta/; }

location ^~ /pli-reporta/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /pli-reporta;
    proxy_set_header Connection         "";
    client_max_body_size 16m;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
}
